<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fashion Store</title>
        
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Welcome to Fashion Store</h1>
        <p>Discover your style with our latest collection</p>
        <button>Shop Now</button>

        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#shop">Shop</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>

        <section id="shop">
            <h2>Our lastest Collection</h2>
            <p>Check out our newest arrivals and find the perfect piece to complete your look.</p>

            <div class="categories">
                <button>ALL</button>
                <button> Tops</button>
                <button> Dresses</button>
                <button> Trousers</button>
                <button>Skirts</button>
                <button>Two-Piece Sets</button>
            </div>
            <div class="product-container">

            <div class="product">
                <img src="http://images.unsplash.com/photo-1551163943-3f6a855d1153?w=500" alt="Fashion top 1">
                <h3>Classic Top</h3>
                <p>$29.99</p>
                <button>Buy Now</button>
            </div>

            <div class="product">
                <img src="http://images.unsplash.com/photo-1595777457583-95e059d581b8?w=500" alt="Elegant Dress"> 
                <h3>Elegant Dress</h3>
                <p>$49.99</p>
                <button>Buy Now</button>
            </div>

            <div class="product">
                <img src="http://images.unsplash.com/photo-1434389677669-e08b4cac3105?w=500" alt="Women's blouse">
                <h3>Stylish Blouse</h3>
                <p>$79.99</p>
                <button>Buy Now</button>
            </div>

          </div>

        </section>
    </body>
</html>
